<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主題樂園最佳參觀路徑規劃系統</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <div class="logo-zone">
                <span class="icon">🎡</span>
                <div>
                    <h1>主題樂園行程規劃系統 <small style="font-size:12px; padding:2px 6px; border-radius:4px; font-weight:bold; background-color: var(--primary); color: #fff;">最佳化導航版</small></h1>
                    <p class="subtitle">輸入您的條件，幫您找出最好玩、最划算的樂園路線！</p>
                </div>
            </div>
            <button id="themeToggle" class="theme-btn">🌞 亮色模式</button>
        </header>

        <div class="main-layout">
            
            <div class="left-column">
                <div class="card control-panel">
                    <h2 class="section-title">📝 設定您的遊玩條件</h2>
                    <div class="inputs-grid">
                        <div class="input-group">
                            <label for="startNodeSelect">🏁 選擇出發起點站</label>
                            <select id="startNodeSelect" class="custom-select">
                                <option value="1">1. 雲霄飛車</option>
                                <option value="2">2. 摩天輪</option>
                                <option value="3">3. 鬼屋</option>
                                <option value="4">4. 海盜船</option>
                                <option value="5">5. 滑水道</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="timeLimitInput">⏱️ 總時間限制 (分鐘)</label>
                            <input type="number" id="timeLimitInput" value="120" min="1">
                        </div>
                        <div class="input-group">
                            <label for="moneyLimitInput">💰 總預算限制 (元)</label>
                            <input type="number" id="moneyLimitInput" value="200" min="1">
                        </div>
                        <div class="input-group">
                            <label for="ageInput">🧑‍🤝‍🧑 遊客年齡</label>
                            <input type="number" id="ageInput" value="16" min="1">
                        </div>
                    </div>

                    <button id="btnOptimize" class="primary-btn" style="margin-top:15px; width:100%;">🪄 開始規劃我的最佳路線</button>
                </div>

                <div class="card map-card">
                    <h2 class="section-title">🗺️ 主題樂園導覽地圖</h2>
                    <div id="cy"></div>
                </div>
            </div>

            <div class="right-column">
                
                <div class="card comparison-card" style="margin-bottom: 16px;">
                    <h2 class="section-title">📊 不同路線方案比一比</h2>
                    <div class="table-responsive">
                        <table class="compare-table" style="width:100%; border-collapse: collapse; text-align: left; font-size: 13px; color: var(--text-main); min-width: 450px;">
                            <thead>
                                <tr style="background: var(--table-header); border-bottom: 2px solid var(--border-color);">
                                    <th style="padding: 12px;">評估指標項目</th>
                                    <th style="padding: 12px; color: var(--accent-dfs); font-size: 14px;">DFS (精確解)</th>
                                    <th style="padding: 12px; color: var(--accent-greedy); font-size: 14px;">Greedy (貪婪解)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr style="border-bottom: 1px solid var(--border-color);">
                                    <td style="padding: 11px; color: var(--text-muted);">🛣️ 建議路線</td>
                                    <td style="padding: 11px; font-weight:600;" id="compDfsPath">-</td>
                                    <td style="padding: 11px; font-weight:600;" id="compGreedyPath">-</td>
                                </tr>
                                <tr style="border-bottom: 1px solid var(--border-color);">
                                    <td style="padding: 11px; color: var(--text-muted);">🎯 成功體驗設施數</td>
                                    <td style="padding: 11px;" id="compDfsCount">-</td>
                                    <td style="padding: 11px;" id="compGreedyCount">-</td>
                                </tr>
                                <tr style="border-bottom: 1px solid var(--border-color);">
                                    <td style="padding: 11px; color: var(--text-muted);">⏱️ 總耗時 (含排隊)</td>
                                    <td style="padding: 11px;" id="compDfsTime">-</td>
                                    <td style="padding: 11px;" id="compGreedyTime">-</td>
                                </tr>
                                <tr style="border-bottom: 1px solid var(--border-color);">
                                    <td style="padding: 11px; color: var(--text-muted);">💰 總門票花費</td>
                                    <td style="padding: 11px;" id="compDfsCost">-</td>
                                    <td style="padding: 11px;" id="compGreedyCost">-</td>
                                </tr>
                                <tr style="border-bottom: 1px solid var(--border-color);">
                                    <td style="padding: 11px; color: var(--text-muted);">🔥 路線綜合熱門度</td>
                                    <td style="padding: 11px; font-weight:700; color: var(--primary);" id="compDfsScore">-</td>
                                    <td style="padding: 11px; font-weight:700; color: var(--primary);" id="compGreedyScore">-</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="card timeline-card">
                    <h2 class="section-title">📋 專屬行程時間表</h2>
                    <div id="timelineContainer" class="timeline-container">
                        <p class="empty-timeline">請點擊上方按鈕開始規劃您的路線！</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="graph.js"></script>
    <script src="dfsAlgorithm.js"></script>
    <script src="greedyAlgorithm.js"></script>
    <script src="ui.js"></script>
</body>
</html>
